name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://restaurant-backend-4phd.onrender.com/api/foods/)
          echo "Backend responded with HTTP $code"
